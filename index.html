<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f7f4"><title>XE Minimal Gallery</title><link rel="stylesheet" href="./assets/styles.css"></head>
<body><header class="site-header"><a class="wordmark" href="./index.html">XE <span id="brandName">Moments</span></a><span class="header-note">A PRIVATE COLLECTION</span></header>
<main class="gallery-shell"><section class="intro"><p class="eyebrow">GALLERY</p><h1 id="galleryTitle">The moments we keep</h1><p id="galleryDescription">A collection of moments, gathered in one place.</p></section>
<section id="albumGrid" class="album-grid"><div class="empty">Loading collections…</div></section>
<section id="albumGate" class="album-gate" hidden><button id="backToAlbums" class="back-link" type="button">← All collections</button><div class="gate-card"><p class="eyebrow">PRIVATE COLLECTION</p><h2 id="gateAlbumName">Album access</h2><p>Enter the album ID and password shared with you.</p><form id="albumLoginForm"><label>Album ID<input id="albumIdInput" type="text" autocomplete="off" required></label><label>Password<input id="albumPasswordInput" type="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">Open album →</button><p id="albumLoginError" class="action-message error"></p></form></div></section>
<section id="albumPhotosView" hidden><button id="backFromPhotos" class="back-link" type="button">← All collections</button><div class="album-view-heading"><p class="eyebrow">PRIVATE COLLECTION</p><h2 id="openedAlbumName"></h2></div><section id="albumPhotos" class="masonry"></section></section></main>
<footer class="site-footer"><span id="footerName">XE Moments</span><span>Made to remember.</span></footer>
<div id="lightbox" class="lightbox" aria-hidden="true"><button id="closeLightbox" class="lb-close" aria-label="Close">×</button><button id="prevPhoto" class="lb-prev" aria-label="Previous photo">‹</button><img id="lightboxImage" alt=""><button id="nextPhoto" class="lb-next" aria-label="Next photo">›</button><div class="lb-bottom"><span id="lightboxCaption"></span><a id="downloadPhoto" href="#" download>Download original</a></div></div>
<script src="./config.js"></script><script src="./assets/albums.js"></script></body></html>
